<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grade Calculator</h1>
        <form id="gradeForm">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your name" required>

            <h2>Subject Marks</h2>

            <label for="english">English</label>
            <input type="number" id="english" min="0" max="100" required>

             <label for="math">Math</label>
            <input type="number" id="math" min="0" max="100" required>

             <label for="science">Science</label>
            <input type="number" id="science" min="0" max="100" required>

             <label for="computer">Computer</label>
            <input type="number" id="computer" min="0" max="100" required>

             <label for="managment">Management</label>
            <input type="number" id="management" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
        </form>
        <div id="result" class="result"></div>
    </div>
    <script src="gradecalculator.js"></script>
</body>
</html>
